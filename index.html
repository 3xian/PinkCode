<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinkCode</title>
    <!--
      Cold-start paint before CSS loads. Keep in sync with tokens.css Dawn:
      base #faf4ed, subtle #797593, highlightHigh #cecacd, rose #d7827e
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #faf4ed;
        color: #797593;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #root {
        height: 100%;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #faf4ed;
        z-index: 9999;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      #boot-splash.done {
        opacity: 0;
      }
      #boot-splash .mark {
        width: 28px;
        height: 28px;
        border: 2px solid #cecacd;
        border-top-color: #d7827e;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      #boot-splash .label {
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="mark"></div>
      <div class="label">PinkCode</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
