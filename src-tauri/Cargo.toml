[package]
name = "pinkcode"
version = "0.3.2"
description = "Desktop control plane for Grok Build multi-task observability"
authors = ["PinkCode"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "pinkcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Dock / process name when running outside a .app (e.g. `tauri dev`)
[[bin]]
name = "PinkCode"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
urlencoding = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
notify = "6"
ureq = { version = "2", features = ["json"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.3.1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"

# Reload multi-size PE icons for title bar + taskbar (Tauri only applies ICO entry[0]).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
