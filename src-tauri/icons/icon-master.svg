  <title id="title">Pink chat logo desktop icon — corrected less-than width</title>
  <desc id="desc">A geometric pink desktop icon with iOS-style continuous corners, a white speech bubble, a center-symmetric asterisk, and a less-than sign whose visual width matches the asterisk.</desc>

  <defs>
    <style>
      .tile { fill: #eb6f92; }
      .white { fill: #FFFFFF; }
      .line {
        fill: none;
        stroke: #FFFFFF;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

